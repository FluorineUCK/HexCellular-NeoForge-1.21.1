patchouli-fabric = "1.20.1-84-FABRIC"
patchouli-forge = "1.20.1-84-FORGE"
yarn = "1.20.1+build.10"

[libraries]
cardinal-components = { module = "dev.onyxstudios.cardinal-components-api:cardinal-components-api", version.ref = "cardinal-components" }
cloth-config-fabric = { module = "me.shedaniel.cloth:cloth-config-fabric", version.ref = "cloth-config" }
