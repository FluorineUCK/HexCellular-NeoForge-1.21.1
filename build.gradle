plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.9-SNAPSHOT"
    id "org.jetbrains.kotlin.jvm" version "2.2.21"
    id "maven-publish"
}

def findWorkspacePath = { List relativeCandidates ->
    def cursor = projectDir
    while (cursor != null) {
        for (relative in relativeCandidates) {
            def candidate = new File(cursor, relative.toString())
            if (candidate.exists()) {
                return candidate
            }
        }
        cursor = cursor.parentFile
    }
    return null
}

def yahaDir = findWorkspacePath(['01-yaha-source/yaha', 'yaha'])
if (yahaDir == null) {
    throw new GradleException("Unable to locate the shared pre2 dependency directory (01-yaha-source/yaha)")
}
def yahaLib = { String fileName -> new File(new File(yahaDir, 'libs'), fileName) }

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

architectury {
    minecraft = project.minecraft_version
    platformSetupLoomIde()
    neoForge {
        platformPackage = "neoforge"
    }
}

loom {
    silentMojangMappingsLicense()
    mods {
        main {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://maven.blamejared.com/" }
    maven {
        name = "Kotlin for Forge"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    neoForge "net.neoforged:neoforge:${project.neo_forge_version}"
    modApi "dev.architectury:architectury-neoforge:${project.architectury_version}"

    compileOnly files(yahaLib("hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar"))
    runtimeOnly files(yahaLib("hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar"))
    runtimeOnly files(yahaLib("paucal-${project.paucal_version}+${project.minecraft_version}-neoforge.jar"))
    runtimeOnly files(yahaLib("inline-${project.minecraft_version}-${project.inline_version}-neoforge-devruntime.jar"))
    runtimeOnly files(yahaLib("caelus-neoforge-${project.caelus_version}.jar"))

    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:${project.forge_kotlin_version}"
    runtimeOnly "vazkii.patchouli:Patchouli:${project.patchouli_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.named("sourcesJar", Jar) {
    exclude "META-INF/neoforge.mods.toml"
    exclude "META-INF/mods.toml"
    exclude "fabric.mod.json"
    exclude "*.mixins.json"
    exclude "**/*.mixins.json"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
